<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER BRAWLER - ABILITY FIGHTER 2.0</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0d0914;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 650px;
      height: 100vh;
      max-height: 920px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      position: relative;
      background: radial-gradient(circle at center, #1b102d 0%, #08040f 100%);
    }

    /* TOP HUD DESIGN */
    .hud-header {
      width: 100%;
      background: rgba(20, 10, 35, 0.85);
      border: 2px solid #ff007f;
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .hud-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 0 0 10px #ffe600;
      line-height: 1;
      margin-top: 2px;
    }

    /* PLAYER & RIVAL BARS */
    .fighter-bars {
      width: 100%;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-container {
      width: 100%;
      background: rgba(10, 5, 20, 0.85);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 4px 8px;
      position: relative;
    }

    .stat-container.rival-bar {
      border-color: #ff0055;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #00f0ff;
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .stat-label.rival-label {
      color: #ff416c;
    }

    .buff-status {
      font-size: 0.65rem;
      color: #ffe600;
      font-weight: 800;
      margin-left: 8px;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #1f192e;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055 0%, #00ff88 100%);
      transition: width 0.15s ease-out;
    }

    .rival-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7 0%, #ff0055 100%);
      transition: width 0.15s ease-out;
    }

    /* GAME CANVAS CONTAINER */
    .canvas-wrapper {
      width: 100%;
      flex: 1;
      margin: 8px 0;
      position: relative;
      border: 3px solid #00f0ff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      background: #05020a;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* CONTROLS AREA */
    .controls-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    /* D-PAD DESIGN FOR TOUCH/ON-SCREEN */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
      justify-content: center;
      align-items: center;
    }

    .dbtn {
      background: rgba(30, 20, 50, 0.85);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 240, 255, 0.3);
    }

    .dbtn:active, .dbtn.active-btn {
      background: #00f0ff;
      color: #000;
      transform: translateY(2px);
      box-shadow: none;
    }

    .dbtn-up { grid-column: 2; grid-row: 1; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-center { grid-column: 2; grid-row: 2; background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.3); cursor: default; }
    .dbtn-right { grid-column: 3; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 3; }

    /* ACTION BUTTONS */
    .action-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .btn {
      padding: 10px 4px;
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
      transition: transform 0.05s, box-shadow 0.05s, background-color 0.1s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .btn:active, .btn.active-btn {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      filter: brightness(1.3);
    }

    .btn-jump {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      border-color: #93c5fd;
    }

    .btn-dash {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      border-color: #fef08a;
    }

    .btn-attack {
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      border-color: #fca5a5;
    }

    .btn-skill {
      background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
      border-color: #e9d5ff;
      opacity: 0.5;
    }

    .btn-skill.ready {
      opacity: 1;
      animation: pulseGlow 0.8s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 5px #a855f7; }
      to { box-shadow: 0 0 20px #00f0ff; }
    }

    .key-guide {
      font-size: 0.65rem;
      color: #ffe600;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      padding: 1px 4px;
      margin-top: 2px;
    }

    /* OVERLAYS */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 4, 15, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      z-index: 20;
      overflow-y: auto;
    }

    /* NICKNAME INPUT FIELD & HALL OF FAME STYLES */
    .nickname-box {
      width: 80%;
      max-width: 300px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nickname-label {
      font-size: 0.8rem;
      color: #00f0ff;
      font-weight: bold;
    }

    .nickname-input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(10, 5, 25, 0.9);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      color: #ffe600;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .nickname-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    .hall-of-fame-card {
      width: 100%;
      max-width: 360px;
      background: rgba(20, 10, 38, 0.9);
      border: 2px solid #ffe600;
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(255, 230, 0, 0.2);
    }

    .hof-title {
      font-size: 0.9rem;
      font-weight: 900;
      color: #ffe600;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .hof-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .hof-table th {
      color: #00f0ff;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      padding: 4px;
    }

    .hof-table td {
      padding: 4px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hof-rank-1 { color: #ffe600; font-weight: bold; }
    .hof-rank-2 { color: #e2e8f0; font-weight: bold; }
    .hof-rank-3 { color: #cd7f32; font-weight: bold; }

    .notice-text {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      margin-top: 6px;
      letter-spacing: -0.3px;
    }

    .hud-subvalue {
      font-size: 0.85rem;
      font-weight: 700;
      color: #00f0ff;
      margin-top: 2px;
    }

    .overlay-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 0 0 15px #ff007f;
      margin-bottom: 10px;
    }

    .overlay-desc {
      font-size: 0.88rem;
      color: #d1d5db;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .hero-select-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    .hero-card {
      flex: 1;
      background: #181124;
      border: 2px solid #443366;
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .hero-card.selected {
      border-color: #00f0ff;
      background: #25163d;
      box-shadow: 0 0 12px #00f0ff;
      transform: scale(1.03);
    }

    .hero-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffe600;
      margin-top: 2px;
    }

    .hero-type {
      font-size: 0.7rem;
      color: #00f0ff;
    }

    .start-btn {
      width: 80%;
      padding: 14px 0;
      font-size: 1.3rem;
      font-weight: 900;
      color: #000;
      background: linear-gradient(180deg, #ffe600 0%, #ff9900 100%);
      border: 3px solid #ffffff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 0 #b36b00;
    }

    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b36b00;
    }

    .final-score {
      font-size: 3rem;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- TOP HUD -->
    <div class="hud-header">
      <div class="hud-box">
        <span class="hud-label">STAGE</span>
        <span id="hudStage" class="hud-value">1</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">남은 시간</span>
        <span id="hudTimer" class="hud-value">03:00</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">점수</span>
        <span id="hudScore" class="hud-value">0</span>
        <div class="hud-subvalue">최고 점수: <span id="hudBestScore">0</span></div>
      </div>
    </div>

    <!-- PLAYER & RIVAL STATS BAR -->
    <div class="fighter-bars">
      <div class="stat-container">
        <div class="stat-label">
          <div>
            <span>PLAYER HP</span>
            <span id="buffStatus" class="buff-status"></span>
          </div>
          <span id="hpText">100 / 100</span>
        </div>
        <div class="bar-bg">
          <div id="hpFill" class="hp-fill"></div>
        </div>
      </div>

      <div class="stat-container rival-bar">
        <div class="stat-label rival-label">
          <span id="rivalNameText">RIVAL HP</span>
          <span id="rivalHpText">150 / 150</span>
        </div>
        <div class="bar-bg">
          <div id="rivalHpFill" class="rival-fill"></div>
        </div>
      </div>
    </div>

    <!-- CANVAS AREA -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>

      <!-- START OVERLAY -->
      <div id="startOverlay" class="overlay">
        <div class="overlay-title">CYBER BRAWLER 2.0</div>
        
        <!-- NICKNAME INPUT -->
        <div class="nickname-box">
          <label class="nickname-label" for="playerNickname">파이터 별명 입력</label>
          <input type="text" id="playerNickname" class="nickname-input" maxlength="8" placeholder="도전자" value="도전자">
        </div>

        <div class="hero-select-box">
          <div class="hero-card selected" onclick="selectHero('blaze', this)">
            <div style="font-size: 1.8rem;">🔥</div>
            <div class="hero-name">블레이즈</div>
            <div class="hero-type">화염 화구</div>
          </div>
          <div class="hero-card" onclick="selectHero('volt', this)">
            <div style="font-size: 1.8rem;">⚡</div>
            <div class="hero-name">볼트</div>
            <div class="hero-type">전광 대시</div>
          </div>
          <div class="hero-card" onclick="selectHero('frost', this)">
            <div style="font-size: 1.8rem;">❄️</div>
            <div class="hero-name">프로스트</div>
            <div class="hero-type">빙결 충격파</div>
          </div>
        </div>

        <button class="start-btn" onclick="startGame()">대전 시작</button>

        <!-- HALL OF FAME DISPLAY -->
        <div class="hall-of-fame-card">
          <div class="hof-title">🏆 명예의 전당 TOP 5</div>
          <table class="hof-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>별명</th>
                <th>ST</th>
                <th>점수</th>
              </tr>
            </thead>
            <tbody id="hofTableBody">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- GAME OVER OVERLAY -->
      <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-title" id="gameOverTitle">GAME OVER</div>
        <div class="overlay-desc" id="gameOverDesc">체력이 모두 소진되었습니다!</div>
        <div class="hud-label" style="font-size: 1rem; color: #fff;">최종 획득 점수</div>
        <div id="finalScoreDisplay" class="final-score">0</div>
        <button class="start-btn" onclick="startGame()">다시 도전</button>

        <!-- HALL OF FAME DISPLAY (End Screen) -->
        <div class="hall-of-fame-card">
          <div class="hof-title">🏆 명예의 전당 TOP 5</div>
          <table class="hof-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>별명</th>
                <th>ST</th>
                <th>점수</th>
              </tr>
            </thead>
            <tbody id="hofEndTableBody">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- CONTROLS PANEL -->
    <div class="controls-panel">
      <!-- TOUCH D-PAD -->
      <div class="dpad-container">
        <button class="dbtn dbtn-up" id="btnUp">▲</button>
        <button class="dbtn dbtn-left" id="btnLeft">◄</button>
        <div class="dbtn dbtn-center"></div>
        <button class="dbtn dbtn-right" id="btnRight">►</button>
        <button class="dbtn dbtn-down" id="btnDown">▼</button>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="action-grid">
        <button class="btn btn-jump" id="btnJump">
          <span>🦘 점프</span>
          <span class="key-guide">[ K / Space ]</span>
        </button>
        <button class="btn btn-dash" id="btnDash">
          <span>⚡ 회피 대시</span>
          <span class="key-guide">[ Shift ]</span>
        </button>
        <button class="btn btn-attack" id="btnAttack">
          <span>🥊 기본 공격</span>
          <span class="key-guide">[ Z / J ]</span>
        </button>
        <button class="btn btn-skill" id="btnSkill">
          <span>✨ 특수 능력</span>
          <span class="key-guide">[ X / L ]</span>
        </button>
      </div>
    </div>

    <!-- BROWSER STORAGE NOTICE -->
    <div class="notice-text">기록은 이 브라우저에만 저장됩니다</div>
  </div>

  <script>
    const GAME_ID = 'ability-fighter-2d-arena';

    // ==========================================
    // [점수 & 명예의 전당 저장 관련 코드 시작]
    // ==========================================
    const STORAGE_KEY = 'best_' + GAME_ID;
    const HOF_KEY = 'hof_' + GAME_ID;
    
    let memoryBestScore = 0; // localStorage 접근 불가 시 백업 저장소
    let memoryHallOfFame = []; // 백업 명예의 전당 데이터 리스트
    let currentPlayerName = '도전자';

    // 명예의 전당 불러오기
    function loadHallOfFame() {
      try {
        const saved = localStorage.getItem(HOF_KEY);
        if (saved !== null) {
          memoryHallOfFame = JSON.parse(saved);
        }
      } catch (e) {
        console.warn('localStorage 명예의 전당 읽기 실패:', e);
      }
      return memoryHallOfFame;
    }

    // 명예의 전당 업데이트 및 최고점수 저장
    function saveScore(newScore, stageReached) {
      const name = currentPlayerName.trim() || '도전자';
      const hof = loadHallOfFame();

      // 새로운 기록 추가
      hof.push({
        name: name,
        score: newScore,
        stage: stageReached,
        date: new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })
      });

      // 점수 내림차순 정렬 후 상위 5개 유지
      hof.sort((a, b) => b.score - a.score);
      const top5 = hof.slice(0, 5);

      memoryHallOfFame = top5;

      try {
        localStorage.setItem(HOF_KEY, JSON.stringify(top5));
      } catch (e) {
        console.warn('localStorage 명예의 전당 저장 실패:', e);
      }

      // 최고 점수 갱신
      if (top5.length > 0) {
        const topScore = top5[0].score;
        memoryBestScore = topScore;
        try {
          localStorage.setItem(STORAGE_KEY, topScore.toString());
        } catch (e) {
          console.warn('localStorage 저장 실패:', e);
        }
        updateBestScoreDisplay(topScore);
      }

      renderHallOfFame();
    }

    function loadBest() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null) {
          memoryBestScore = parseInt(saved, 10) || 0;
        }
      } catch (e) {
        console.warn('localStorage 읽기 실패:', e);
      }
      return memoryBestScore;
    }

    function updateBestScoreDisplay(scoreVal) {
      const bestEl = document.getElementById('hudBestScore');
      if (bestEl) {
        bestEl.innerText = scoreVal;
      }
    }

    // 명예의 전당 UI 출력
    function renderHallOfFame() {
      const hof = loadHallOfFame();
      const startTable = document.getElementById('hofTableBody');
      const endTable = document.getElementById('hofEndTableBody');

      let rowsHtml = '';
      if (hof.length === 0) {
        rowsHtml = `<tr><td colspan="4" style="text-align:center; color:#888;">등록된 기록이 없습니다.</td></tr>`;
      } else {
        hof.forEach((item, index) => {
          const rankClass = index === 0 ? 'hof-rank-1' : (index === 1 ? 'hof-rank-2' : (index === 2 ? 'hof-rank-3' : ''));
          const rankMedal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : `${index + 1}`));
          rowsHtml += `
            <tr class="${rankClass}">
              <td>${rankMedal}</td>
              <td>${item.name}</td>
              <td>ST.${item.stage || 1}</td>
              <td>${item.score.toLocaleString()}</td>
            </tr>
          `;
        });
      }

      if (startTable) startTable.innerHTML = rowsHtml;
      if (endTable) endTable.innerHTML = rowsHtml;
    }

    // 페이지 로드 시 최고 점수 및 명예의 전당 표출
    window.addEventListener('DOMContentLoaded', () => {
      const initialBest = loadBest();
      updateBestScoreDisplay(initialBest);
      renderHallOfFame();
    });
    // ==========================================
    // [점수 & 명예의 전당 저장 관련 코드 끝]
    // ==========================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Arena Vertical Depth Limits
    let ARENA_MIN_Y = 0;
    let ARENA_MAX_Y = 0;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ARENA_MIN_Y = canvas.height * 0.45; // Top limit of 2D floor
      ARENA_MAX_Y = canvas.height - 25;  // Bottom limit of 2D floor
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Control States
    let gameActive = false;
    let score = 0;
    let timeLeft = 180;
    let timerInterval = null;
    let animationFrameId = null;

    let selectedHeroType = 'blaze';
    let currentStage = 1;

    // Presets
    const HERO_PRESETS = {
      blaze: { name: '블레이즈', color: '#ff3300', accent: '#ffe600' },
      volt: { name: '볼트', color: '#00f0ff', accent: '#ffffff' },
      frost: { name: '프로스트', color: '#a855f7', accent: '#38bdf8' }
    };

    const ENEMY_PRESETS = [
      { name: '사이버 닌자', color: '#10b981', accent: '#a7f3d0', hp: 160, speed: 3.4, attackDmg: 10, range: 65 },
      { name: '섀도우 블레이드', color: '#f59e0b', accent: '#fef08a', hp: 240, speed: 3.8, attackDmg: 15, range: 70 },
      { name: '다크 프로스트', color: '#6366f1', accent: '#c7d2fe', hp: 320, speed: 4.2, attackDmg: 18, range: 75 },
      { name: '볼케이노 타이탄', color: '#e11d48', accent: '#fecdd3', hp: 450, speed: 4.5, attackDmg: 24, range: 85 }
    ];

    // Item Types & Configs
    const ITEM_TYPES = {
      HP: { type: 'HP', icon: '💚', name: 'HP 회복', color: '#10b981' },
      BUFF_DMG: { type: 'BUFF_DMG', icon: '⚔️', name: '공격력 증폭', color: '#ef4444' },
      BUFF_SPD: { type: 'BUFF_SPD', icon: '⚡', name: '이동속도 증가', color: '#ffe600' },
      ULT_CHARGE: { type: 'ULT_CHARGE', icon: '✨', name: '스킬 충전', color: '#a855f7' }
    };

    // Audio Generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'attack') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'skill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'dash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'item') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1040, now + 0.2);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }

    // Entities
    let player = null;
    let rival = null;
    let particles = [];
    let projectiles = [];
    let droppedItems = [];

    // Drop Item Class
    class DroppedItem {
      constructor(x, y, itemType) {
        this.x = x;
        this.y = y;
        this.config = itemType;
        this.radius = 16;
        this.bounceTimer = Math.random() * Math.PI * 2;
        this.lifetime = 600; // 10 seconds before despawn
      }

      update() {
        this.bounceTimer += 0.08;
        this.lifetime--;
      }

      draw() {
        const floatY = this.y + Math.sin(this.bounceTimer) * 6;

        // Ground Shadow
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 12, this.radius * 0.8, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Item Glow Orb
        ctx.shadowColor = this.config.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(20, 10, 35, 0.85)';
        ctx.strokeStyle = this.config.color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(this.x, floatY, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Emoji Icon
        ctx.font = '16px Segoe UI Emoji, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.config.icon, this.x, floatY);

        ctx.restore();
      }
    }

    // Player Class (Supports 2D Arena Plane & Jump Z-axis)
    class Player {
      constructor(type) {
        this.type = type;
        this.preset = HERO_PRESETS[type];
        
        // 2D Ground Coordinates
        this.x = canvas.width * 0.25;
        this.y = (ARENA_MIN_Y + ARENA_MAX_Y) / 2;
        
        // Vertical Jump Height (Z-axis offset)
        this.z = 0;
        this.vz = 0;
        this.isJumping = false;

        this.radius = 22;
        this.vx = 0;
        this.vy = 0;
        this.baseSpeed = 4.8;
        this.speed = 4.8;
        this.facingX = 1; // 1: Right, -1: Left
        this.facingY = 0;

        this.attackCooldown = 0;
        this.attackAnim = 0;

        this.maxHp = 100;
        this.hp = 100;
        this.hitsRequired = 3;
        this.hitCount = 0;
        this.invulnerableFrames = 0;

        // Buff Timers
        this.dmgBuffTimer = 0;
        this.spdBuffTimer = 0;
        this.attackMultiplier = 1.0;
      }

      update() {
        // Buff Timers Handling
        if (this.dmgBuffTimer > 0) {
          this.dmgBuffTimer--;
          if (this.dmgBuffTimer === 0) this.attackMultiplier = 1.0;
        }

        if (this.spdBuffTimer > 0) {
          this.spdBuffTimer--;
          if (this.spdBuffTimer === 0) this.speed = this.baseSpeed;
        }

        // Position Update
        this.x += this.vx;
        this.y += this.vy;

        // Arena 2D Boundary Collisions
        if (this.x - this.radius < 10) this.x = this.radius + 10;
        if (this.x + this.radius > canvas.width - 10) this.x = canvas.width - this.radius - 10;
        if (this.y < ARENA_MIN_Y) this.y = ARENA_MIN_Y;
        if (this.y > ARENA_MAX_Y) this.y = ARENA_MAX_Y;

        // Jump / Gravity Physics
        if (this.isJumping) {
          this.z += this.vz;
          this.vz -= 0.8; // Gravity strength
          if (this.z <= 0) {
            this.z = 0;
            this.vz = 0;
            this.isJumping = false;
          }
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.attackAnim > 0) this.attackAnim--;
        if (this.invulnerableFrames > 0) this.invulnerableFrames--;

        // Check Items Collision
        this.checkItemPickup();
      }

      checkItemPickup() {
        for (let i = droppedItems.length - 1; i >= 0; i--) {
          const item = droppedItems[i];
          const dist = Math.hypot(this.x - item.x, this.y - item.y);
          
          if (dist < this.radius + item.radius) {
            this.applyItemEffect(item.config);
            createParticles(item.x, item.y, item.config.color, 20);
            droppedItems.splice(i, 1);
          }
        }
      }

      applyItemEffect(config) {
        playSound('item');

        if (config.type === 'HP') {
          this.heal(30);
        } else if (config.type === 'BUFF_DMG') {
          this.dmgBuffTimer = 480; // 8 Seconds
          this.attackMultiplier = 1.6;
        } else if (config.type === 'BUFF_SPD') {
          this.spdBuffTimer = 480; // 8 Seconds
          this.speed = this.baseSpeed * 1.5;
        } else if (config.type === 'ULT_CHARGE') {
          this.hitCount = this.hitsRequired;
        }

        updatePlayerStatsHUD();
      }

      heal(amount) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
        playSound('heal');
        createParticles(this.x, this.y - this.z, '#00ff88', 18);
        updatePlayerStatsHUD();
      }

      draw() {
        // Ground Shadow
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        const shadowScale = Math.max(0.3, 1 - this.z / 100);
        ctx.ellipse(this.x, this.y, this.radius * shadowScale, (this.radius / 2) * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Render Character with Z elevation offset
        const drawY = this.y - this.z;

        ctx.save();
        ctx.translate(this.x, drawY);

        if (this.invulnerableFrames % 4 > 2) {
          ctx.restore();
          return;
        }

        // Body Glow & Buff Aura
        ctx.shadowColor = this.dmgBuffTimer > 0 ? '#ef4444' : (this.spdBuffTimer > 0 ? '#ffe600' : this.preset.color);
        ctx.shadowBlur = this.dmgBuffTimer > 0 || this.spdBuffTimer > 0 ? 25 : 14;

        // Fighter Circle
        ctx.fillStyle = this.preset.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Visor Direction Indicator
        ctx.fillStyle = this.preset.accent;
        ctx.fillRect(this.facingX === 1 ? 2 : -14, -7, 12, 6);

        // Attack Swing
        if (this.attackAnim > 0) {
          ctx.strokeStyle = this.attackMultiplier > 1.0 ? '#ff0055' : '#ffffff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(this.facingX * 26, 0, 22, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      jump() {
        if (!this.isJumping) {
          this.isJumping = true;
          this.vz = 11; // Jump velocity
        }
      }

      takeDamage(amount, attackerZ = 0) {
        // High jump dodges ground projectiles/attacks
        if (this.z > 30 && attackerZ < 15) return;
        if (this.invulnerableFrames > 0) return;

        this.hp -= amount;
        this.invulnerableFrames = 25;
        playSound('hit');
        createParticles(this.x, this.y - this.z, '#ff0055', 15);
        updatePlayerStatsHUD();

        if (this.hp <= 0) {
          this.hp = 0;
          updatePlayerStatsHUD();
          gameOver(score, '체력이 모두 소진되어 패배하였습니다!');
        }
      }

      attack() {
        if (this.attackCooldown > 0) return;
        this.attackCooldown = 16;
        this.attackAnim = 8;
        playSound('attack');

        // Check 2D Hitbox distance with Rival Fighter
        if (rival && rival.hp > 0) {
          const dx = Math.abs((this.x + this.facingX * 35) - rival.x);
          const dy = Math.abs(this.y - rival.y);
          const dz = Math.abs(this.z - rival.z);

          // Requires alignment in Depth (Y) and Height (Z)
          if (dx < 60 && dy < 35 && dz < 40) {
            const finalDmg = 35 * this.attackMultiplier;
            rival.takeDamage(finalDmg, this.z);
            if (this.hitCount < this.hitsRequired) {
              this.hitCount++;
              updatePlayerStatsHUD();
            }
          }
        }
      }

      useSkill() {
        if (this.hitCount < this.hitsRequired) return;
        this.hitCount = 0;
        updatePlayerStatsHUD();
        playSound('skill');

        const skillDmg = 75 * this.attackMultiplier;

        if (this.type === 'blaze') {
          projectiles.push(new Projectile(this.x, this.y, this.z, this.facingX * 10, this.facingY * 2, '#ff3300', 22, skillDmg, true));
        } else if (this.type === 'volt') {
          this.x += this.facingX * 120;
          this.y += this.facingY * 60;
          createParticles(this.x, this.y - this.z, '#00f0ff', 25);

          if (rival && Math.abs(this.y - rival.y) < 45 && Math.abs(this.x - rival.x) < 100) {
            rival.takeDamage(skillDmg * 1.2, this.z);
          }
        } else if (this.type === 'frost') {
          createParticles(this.x, this.y - this.z, '#38bdf8', 40);
          if (rival && Math.hypot(this.x - rival.x, this.y - rival.y) < 150) {
            rival.takeDamage(skillDmg * 1.3, this.z);
          }
        }
      }

      dash() {
        playSound('dash');
        const dashDistX = (this.vx !== 0 ? Math.sign(this.vx) : this.facingX) * 70;
        const dashDistY = (this.vy !== 0 ? Math.sign(this.vy) : 0) * 50;

        this.x += dashDistX;
        this.y += dashDistY;
        this.invulnerableFrames = 12; // Brief invincibility during dash
        createParticles(this.x, this.y - this.z, '#ffffff', 12);
      }
    }

    // Smart 2D Arena Rival Fighter Class
    class RivalFighter {
      constructor(stage) {
        const presetIndex = Math.min(stage - 1, ENEMY_PRESETS.length - 1);
        const data = ENEMY_PRESETS[presetIndex];

        this.name = data.name;
        this.color = data.color;
        this.accent = data.accent;
        this.maxHp = data.hp;
        this.hp = data.hp;
        this.speed = data.speed;
        this.attackDamage = data.attackDmg;
        this.attackRange = data.range;

        this.x = canvas.width * 0.75;
        this.y = (ARENA_MIN_Y + ARENA_MAX_Y) / 2;
        this.z = 0;
        this.radius = 22;

        this.facingX = -1;
        this.attackCooldown = 0;
        this.specialCooldown = 100;
        this.attackAnim = 0;
        this.invulnerableFrames = 0;
      }

      update() {
        if (!player) return;

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.specialCooldown > 0) this.specialCooldown--;
        if (this.attackAnim > 0) this.attackAnim--;
        if (this.invulnerableFrames > 0) this.invulnerableFrames--;

        this.facingX = player.x > this.x ? 1 : -1;

        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist2D = Math.hypot(dx, dy);

        // Smart 2D Flanking and Movement Logic
        if (dist2D > this.attackRange) {
          this.x += (dx / dist2D) * this.speed;
          this.y += (dy / dist2D) * (this.speed * 0.7); // Y axis tracking
        } else {
          // Attack when aligned on Y plane
          if (Math.abs(dy) < 25 && this.attackCooldown === 0) {
            this.attackCooldown = 38;
            this.attackAnim = 8;
            player.takeDamage(this.attackDamage, this.z);
          }
        }

        // Special Ranged Attack in 2D Space
        if (this.specialCooldown === 0 && dist2D < 260) {
          this.specialCooldown = 150;
          projectiles.push(new Projectile(
            this.x, this.y, this.z,
            (dx / dist2D) * 7.5, (dy / dist2D) * 2.5,
            this.color, 18, 20, false
          ));
        }
      }

      draw() {
        // Ground Shadow
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.radius, this.radius / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(this.x, this.y - this.z);

        if (this.invulnerableFrames % 4 > 2) {
          ctx.restore();
          return;
        }

        ctx.shadowColor = this.color;
        ctx.shadowBlur = 14;

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.accent;
        ctx.fillRect(this.facingX === 1 ? 2 : -14, -7, 12, 6);

        if (this.attackAnim > 0) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(this.facingX * 26, 0, 22, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      takeDamage(amount, attackerZ = 0) {
        if (this.invulnerableFrames > 0) return;

        this.hp -= amount;
        this.invulnerableFrames = 15;
        playSound('hit');
        createParticles(this.x, this.y - this.z, this.color, 14);

        // Chance to Drop Buff Item on hit
        if (Math.random() < 0.25) {
          const itemKeys = Object.keys(ITEM_TYPES);
          const randomType = ITEM_TYPES[itemKeys[Math.floor(Math.random() * itemKeys.length)]];
          droppedItems.push(new DroppedItem(this.x + (Math.random() - 0.5) * 40, this.y + (Math.random() - 0.5) * 20, randomType));
        }

        updateRivalStatsHUD();

        if (this.hp <= 0) {
          this.hp = 0;
          updateRivalStatsHUD();
          score += 600 * currentStage;
          updateScoreHUD();
          createParticles(this.x, this.y - this.z, '#ffe600', 35);

          // Guaranteed Multi-Item Drop on Rival Defeat!
          const itemKeys = Object.keys(ITEM_TYPES);
          droppedItems.push(new DroppedItem(this.x, this.y, ITEM_TYPES.HP));
          droppedItems.push(new DroppedItem(this.x - 30, this.y + 10, ITEM_TYPES[itemKeys[Math.floor(Math.random() * itemKeys.length)]]));

          // Player HP Recovery on Defeat!
          if (player) {
            player.heal(35);
          }

          currentStage++;
          if (currentStage <= ENEMY_PRESETS.length) {
            rival = new RivalFighter(currentStage);
            updateRivalStatsHUD();
            document.getElementById('hudStage').innerText = currentStage;
          } else {
            gameOver(score, '모든 챔피언을 격파하고 궁극의 격투왕이 되었습니다!');
          }
        }
      }
    }

    // 2D Skill Projectile
    class Projectile {
      constructor(x, y, z, vx, vy, color, radius, damage, isPlayerOwner) {
        this.x = x; this.y = y; this.z = z;
        this.vx = vx; this.vy = vy;
        this.color = color;
        this.radius = radius;
        this.damage = damage;
        this.isPlayerOwner = isPlayerOwner;
        this.active = true;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < -30 || this.x > canvas.width + 30 || this.y < ARENA_MIN_Y - 50 || this.y > ARENA_MAX_Y + 50) {
          this.active = false;
        }

        if (this.isPlayerOwner) {
          if (rival && Math.hypot(this.x - rival.x, this.y - rival.y) < this.radius + rival.radius) {
            rival.takeDamage(this.damage, this.z);
            this.active = false;
          }
        } else {
          if (player && Math.hypot(this.x - player.x, this.y - player.y) < this.radius + player.radius) {
            player.takeDamage(this.damage, this.z);
            this.active = false;
          }
        }
      }

      draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(this.x, this.y - this.z, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Visual Particles
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.color = color;
        this.life = 18;
        this.maxLife = 18;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function selectHero(heroType, cardEl) {
      selectedHeroType = heroType;
      document.querySelectorAll('.hero-card').forEach(el => el.classList.remove('selected'));
      cardEl.classList.add('selected');
    }

    // Touch Controls Setup
    function setupButtonEvents(id, onPress, onRelease) {
      const btn = document.getElementById(id);
      if (!btn) return;

      const press = (e) => {
        e.preventDefault();
        btn.classList.add('active-btn');
        onPress();
      };
      const release = (e) => {
        e.preventDefault();
        btn.classList.remove('active-btn');
        if (onRelease) onRelease();
      };

      btn.addEventListener('touchstart', press);
      btn.addEventListener('touchend', release);
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    }

    // D-Pad Directional Controls
    setupButtonEvents('btnUp', () => { if(player) { player.vy = -player.speed * 0.7; player.facingY = -1; } }, () => { if(player && player.vy < 0) player.vy = 0; });
    setupButtonEvents('btnDown', () => { if(player) { player.vy = player.speed * 0.7; player.facingY = 1; } }, () => { if(player && player.vy > 0) player.vy = 0; });
    setupButtonEvents('btnLeft', () => { if(player) { player.vx = -player.speed; player.facingX = -1; } }, () => { if(player && player.vx < 0) player.vx = 0; });
    setupButtonEvents('btnRight', () => { if(player) { player.vx = player.speed; player.facingX = 1; } }, () => { if(player && player.vx > 0) player.vx = 0; });

    // Action Controls
    setupButtonEvents('btnJump', () => { if(player) player.jump(); });
    setupButtonEvents('btnDash', () => { if(player) player.dash(); });
    setupButtonEvents('btnAttack', () => { if(player) player.attack(); });
    setupButtonEvents('btnSkill', () => { if(player) player.useSkill(); });

    // KEYBOARD CONTROLS (WASD + Arrow Keys Supported)
    const activeKeys = {};

    function updateKeyboardMovement() {
      if (!player) return;

      let vx = 0;
      let vy = 0;

      if (activeKeys['ArrowLeft'] || activeKeys['KeyA']) { vx -= player.speed; player.facingX = -1; }
      if (activeKeys['ArrowRight'] || activeKeys['KeyD']) { vx += player.speed; player.facingX = 1; }
      if (activeKeys['ArrowUp'] || activeKeys['KeyW']) { vy -= player.speed * 0.7; player.facingY = -1; }
      if (activeKeys['ArrowDown'] || activeKeys['KeyS']) { vy += player.speed * 0.7; player.facingY = 1; }

      player.vx = vx;
      player.vy = vy;
    }

    window.addEventListener('keydown', (e) => {
      if (!gameActive || !player) return;
      if (activeKeys[e.code]) return;
      activeKeys[e.code] = true;

      updateKeyboardMovement();

      if (e.code === 'KeyK' || e.code === 'Space') {
        e.preventDefault();
        player.jump();
      }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        e.preventDefault();
        player.dash();
      }
      if (e.code === 'KeyZ' || e.code === 'KeyJ') {
        player.attack();
      }
      if (e.code === 'KeyX' || e.code === 'KeyL') {
        player.useSkill();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (!player) return;
      activeKeys[e.code] = false;
      updateKeyboardMovement();
    });

    // HUD Update Functions
    function updateScoreHUD() {
      document.getElementById('hudScore').innerText = score;
    }

    function updateTimerHUD() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('hudTimer').innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updatePlayerStatsHUD() {
      if (!player) return;
      
      const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
      document.getElementById('hpFill').style.width = `${hpPercent}%`;
      document.getElementById('hpText').innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;

      // Active Buff HUD Indicator
      const buffEl = document.getElementById('buffStatus');
      let statusText = '';
      if (player.dmgBuffTimer > 0) statusText += '⚔️공격력↑ ';
      if (player.spdBuffTimer > 0) statusText += '⚡속도↑ ';
      buffEl.innerText = statusText;

      const skillBtn = document.getElementById('btnSkill');
      if (player.hitCount >= player.hitsRequired) {
        skillBtn.classList.add('ready');
      } else {
        skillBtn.classList.remove('ready');
      }
    }

    function updateRivalStatsHUD() {
      if (!rival) return;
      document.getElementById('rivalNameText').innerText = `${rival.name} HP`;
      const hpPercent = Math.max(0, (rival.hp / rival.maxHp) * 100);
      document.getElementById('rivalHpFill').style.width = `${hpPercent}%`;
      document.getElementById('rivalHpText').innerText = `${Math.ceil(rival.hp)} / ${rival.maxHp}`;
    }

    // GAME RENDER LOOP
    function gameLoop() {
      if (!gameActive) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render 2D Isometric Arena Perspective Floor
      ctx.fillStyle = '#110b1f';
      ctx.fillRect(0, ARENA_MIN_Y - 20, canvas.width, ARENA_MAX_Y - ARENA_MIN_Y + 50);

      // Arena Grid Lines
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.lineWidth = 1;

      for (let y = ARENA_MIN_Y; y <= ARENA_MAX_Y; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, ARENA_MIN_Y - 20);
      ctx.lineTo(canvas.width, ARENA_MIN_Y - 20);
      ctx.stroke();

      // Update & Draw Dropped Items
      for (let i = droppedItems.length - 1; i >= 0; i--) {
        const item = droppedItems[i];
        item.update();
        if (item.lifetime <= 0) {
          droppedItems.splice(i, 1);
        } else {
          item.draw();
        }
      }

      // Entity Update Order (Z-indexing sorted by Y coordinate for depth)
      const entities = [player, rival].filter(Boolean);
      entities.sort((a, b) => a.y - b.y);

      // Update & Draw Entities
      player.update();
      if (rival) rival.update();

      entities.forEach(ent => ent.draw());

      // Projectiles
      projectiles.forEach(p => p.update());
      projectiles = projectiles.filter(p => p.active);
      projectiles.forEach(p => p.draw());

      // Particles
      particles.forEach(p => p.update());
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => p.draw());

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameOver(finalScore, reason = '경기 시간이 종료되었습니다!') {
      gameActive = false;
      clearInterval(timerInterval);
      cancelAnimationFrame(animationFrameId);

      // 별명 및 명예의 전당 저장 처리
      saveScore(finalScore, currentStage);

      document.getElementById('gameOverTitle').innerText = player && player.hp <= 0 ? 'DEFEATED' : 'GAME OVER';
      document.getElementById('gameOverDesc').innerText = reason;
      document.getElementById('finalScoreDisplay').innerText = finalScore;
      document.getElementById('gameOverOverlay').style.display = 'flex';
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      // 플레이어 별명 가져오기
      const inputEl = document.getElementById('playerNickname');
      if (inputEl && inputEl.value.trim()) {
        currentPlayerName = inputEl.value.trim();
      } else {
        currentPlayerName = '도전자';
      }

      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('gameOverOverlay').style.display = 'none';

      score = 0;
      timeLeft = 180;
      currentStage = 1;
      particles = [];
      projectiles = [];
      droppedItems = [];

      document.getElementById('hudStage').innerText = currentStage;

      player = new Player(selectedHeroType);
      rival = new RivalFighter(currentStage);

      updateScoreHUD();
      updateTimerHUD();
      updatePlayerStatsHUD();
      updateRivalStatsHUD();

      gameActive = true;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        updateTimerHUD();

        if (timeLeft <= 0) {
          gameOver(score, '3분 경기 시간이 종료되었습니다!');
        }
      }, 1000);

      cancelAnimationFrame(animationFrameId);
      gameLoop();
    }
  </script>
</body>
</html>
